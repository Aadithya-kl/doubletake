name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools for the human view
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress
          google-chrome --version
      - run: pip install -e ".[parsers,dev]"
      - run: doubletake selftest
      - run: pytest -q
