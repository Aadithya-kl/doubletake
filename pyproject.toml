[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doubletake"
version = "0.2.0"
description = "Split-view red teaming for LLM document ingestion: find where your parser shows the model something the human never saw."
authors = [{ name = "Aadithya-kl" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "rag", "pdf", "document-parsing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "click>=8",
  "reportlab>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "pypdf>=4",
  "beautifulsoup4>=4.12",
  "pytesseract>=0.3",
  "Pillow>=10",
]

[project.optional-dependencies]
parsers = ["pdfplumber", "pdfminer.six", "markitdown[pdf,docx,xlsx,pptx]"]
dev = ["pytest"]

[project.scripts]
doubletake = "doubletake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/Aadithya-kl/doubletake"
Issues = "https://github.com/Aadithya-kl/doubletake/issues"
